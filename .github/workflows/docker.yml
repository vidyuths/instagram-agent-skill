# Builds the IG Studio image on GitHub's machines and publishes it to
# ghcr.io, so the Coolify server only has to pull and run it.
name: Docker image

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "skills/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/docker.yml"
  # Build without publishing, to check a PR before it merges.
  pull_request:
    paths:
      - "web/**"
      - "skills/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Optional. Set both as repository secrets to redeploy on Coolify
      # after each publish; without them the image is only published.
      COOLIFY_DEPLOY_URL: ${{ secrets.COOLIFY_DEPLOY_URL }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Redeploy on Coolify
        if: github.event_name != 'pull_request' && env.COOLIFY_DEPLOY_URL != '' && env.COOLIFY_TOKEN != ''
        run: |
          curl -fsS --max-time 60 -H "Authorization: Bearer $COOLIFY_TOKEN" "$COOLIFY_DEPLOY_URL"
